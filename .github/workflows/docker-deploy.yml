name: Build & Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - 'proto/**'
      - 'package.json'
      - 'render.yaml'

jobs:
  build-and-push:
    name: Build Docker image (Python gRPC Riva — no Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            harshanseliyan28/hsbot-backend:latest
            harshanseliyan28/hsbot-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Option A: trigger via deploy hook URL (set RENDER_DEPLOY_HOOK_URL secret)
      - name: Trigger Render deploy (hook URL)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || true

      # Option B: trigger via Render API (set RENDER_API_KEY + RENDER_SERVICE_ID secrets)
      - name: Trigger Render deploy (API)
        if: ${{ secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID != '' }}
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' || true
