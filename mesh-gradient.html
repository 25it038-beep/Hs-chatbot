<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Seamless GPU Mesh Gradient</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #08090b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }
    .fallback-gradient {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      transition: background 0.8s ease;
      z-index: 0;
    }

    /* Minimalist floating control dock */
    .dock {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(18, 20, 24, 0.45);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .dock:hover {
      background: rgba(22, 25, 30, 0.65);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .dock-btn {
      appearance: none;
      border: none;
      outline: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: rgba(255, 255, 255, 0.72);
      background: transparent;
      border-radius: 9999px;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }
    .dock-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }
    .dock-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      display: inline-block;
      flex-shrink: 0;
    }
    .divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.14);
      margin: 0 4px;
    }

    /* Subdued title & loop indicator */
    .header-info {
      position: fixed;
      top: 24px;
      left: 28px;
      z-index: 10;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .header-info h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 3px;
    }
    .header-info p {
      font-size: 12px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .loop-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #29e6ff;
      box-shadow: 0 0 8px #29e6ff;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* Fallback banner */
    #fallbackNotice {
      display: none;
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>

  <!-- WebGL Output Canvas -->
  <canvas id="glcanvas"></canvas>

  <!-- Fallback element if WebGL is unsupported -->
  <div id="fallback" class="fallback-gradient" style="display: none;"></div>
  <div id="fallbackNotice">WebGL unavailable: CSS fallback active</div>

  <!-- Subtle overlay label -->
  <div class="header-info">
    <h1 id="titleLabel">GPU Mesh Gradient</h1>
    <p><span class="loop-indicator"></span> Seamless Toroidal Loop · 4×4 Bayer Dither</p>
  </div>

  <!-- Interactive Preset Switcher Dock -->
  <nav class="dock" aria-label="Palette Switcher">
    <button class="dock-btn" data-preset="noir">
      <span class="color-swatch" style="background: linear-gradient(135deg, #08090b, #8b9099, #f3f4f6)"></span>
      Noir
    </button>
    <button class="dock-btn" data-preset="mint">
      <span class="color-swatch" style="background: linear-gradient(135deg, #f7f4e8, #9ccfb2, #5c9c85)"></span>
      Mint
    </button>
    <button class="dock-btn active" data-preset="plum">
      <span class="color-swatch" style="background: linear-gradient(135deg, #180814, #48103e, #e07a9c)"></span>
      Plum
    </button>
    <button class="dock-btn" data-preset="neon">
      <span class="color-swatch" style="background: linear-gradient(135deg, #04060a, #7dff4d, #29e6ff)"></span>
      Neon
    </button>

    <div class="divider"></div>

    <button class="dock-btn" id="ditherToggle" title="Toggle 4x4 Bayer Dithering">
      Dither: ON
    </button>
  </nav>

  <!-- Vertex Shader: Single full-screen triangle covering (-1,-1, 3,-1, -1,3) -->
  <script id="vs" type="x-shader/x-vertex">
    attribute vec2 a_pos;
    varying vec2 v_pos;
    void main() {
      v_pos = a_pos;
      gl_Position = vec4(a_pos, 0.0, 1.0);
    }
  </script>

  <!-- Fragment Shader -->
  <script id="fs" type="x-shader/x-fragment">
    #ifdef GL_FRAGMENT_PRECISION_HIGH
      precision highp float;
    #else
      precision mediump float;
    #endif

    varying vec2 v_pos;

    uniform vec2 u_resolution;
    uniform float u_t;
    uniform vec2 u_pointer;
    uniform float u_dither_strength;

    // Palette stops (smoothly interpolated on CPU)
    uniform vec3 u_c0;
    uniform vec3 u_c1;
    uniform vec3 u_c2;
    uniform vec3 u_c3;

    // 2D Value Noise with analytical smooth cubic interpolation
    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
        mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
        u.y
      );
    }

    // 5 octaves of value noise, each 2.02x frequency at half amplitude
    float fbm(vec2 p) {
      float v = 0.0;
      float amp = 0.5;
      for (int i = 0; i < 5; i++) {
        v += amp * noise(p);
        p = p * 2.02;
        amp *= 0.5;
      }
      return v;
    }

    // 4x4 Bayer Matrix for ordered spatial dithering
    // Maps coordinate modulo 4 into value centered at [-0.5 .. 0.5]
    float bayer4(vec2 coord) {
      vec2 b = floor(mod(coord, 4.0));
      float d = 0.0;
      if (b.y < 2.0) {
        if (b.y < 1.0) {
          d = (b.x < 2.0) ? ((b.x < 1.0) ? 0.0 : 8.0) : ((b.x < 3.0) ? 2.0 : 10.0);
        } else {
          d = (b.x < 2.0) ? ((b.x < 1.0) ? 12.0 : 4.0) : ((b.x < 3.0) ? 14.0 : 6.0);
        }
      } else {
        if (b.y < 3.0) {
          d = (b.x < 2.0) ? ((b.x < 1.0) ? 3.0 : 11.0) : ((b.x < 3.0) ? 1.0 : 9.0);
        } else {
          d = (b.x < 2.0) ? ((b.x < 1.0) ? 15.0 : 7.0) : ((b.x < 3.0) ? 13.0 : 5.0);
        }
      }
      return (d / 16.0) - 0.5;
    }

    void main() {
      // Correct aspect ratio and apply subtle eased pointer parallax
      float aspect = u_resolution.x / u_resolution.y;
      vec2 p = v_pos * vec2(aspect, 1.0) * 1.35;
      p += u_pointer * 0.22;

      // THE SEAMLESS LOOP:
      // Sample along a closed circle so when u_t completes 2*PI, the state is frame 0
      vec2 orb = vec2(cos(u_t), sin(u_t)) * 0.55;

      // THE FIELD: domain-warped fbm, warped twice
      vec2 q = vec2(
        fbm(p + orb),
        fbm(p + orb.yx + 3.1)
      );

      vec2 r = vec2(
        fbm(p + 2.0 * q + orb * 1.3 + 1.7),
        fbm(p + 2.0 * q - orb + 9.2)
      );

      float f = fbm(p + 1.8 * r);

      // Remap field to 0..1 and compute warp intensity s
      float g = clamp(f, 0.0, 1.0);
      float s = length(q);

      // THE PALETTE: four stops mixed by the field with soft overlapping smoothstep windows
      vec3 col = mix(u_c0, u_c1, smoothstep(0.0, 0.45, g));
      col = mix(col, u_c2, smoothstep(0.35, 0.78, g));
      col = mix(col, u_c3, smoothstep(0.62, 1.0, g) * (0.55 + 0.45 * s));

      // THE DITHER: 4x4 Bayer matrix centered to -0.5..0.5 and scaled to ~0.016
      // Prevents 8-bit banding across smooth transitions
      col += bayer4(gl_FragCoord.xy) * u_dither_strength;

      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }
  </script>

  <script>
    (function() {
      // Palette definitions matching prompt specifications
      const PALETTES = {
        noir: {
          name: "Noir",
          stops: [
            hexToRgb("#08090b"),
            hexToRgb("#2f3237"),
            hexToRgb("#8b9099"),
            hexToRgb("#f3f4f6")
          ],
          hexStops: ["#08090b", "#2f3237", "#8b9099", "#f3f4f6"]
        },
        mint: {
          name: "Mint",
          stops: [
            hexToRgb("#f7f4e8"),
            hexToRgb("#dcecd9"),
            hexToRgb("#9ccfb2"),
            hexToRgb("#5c9c85")
          ],
          hexStops: ["#f7f4e8", "#dcecd9", "#9ccfb2", "#5c9c85"]
        },
        plum: {
          name: "Plum",
          stops: [
            hexToRgb("#180814"),
            hexToRgb("#48103e"),
            hexToRgb("#95275f"),
            hexToRgb("#e07a9c")
          ],
          hexStops: ["#180814", "#48103e", "#95275f", "#e07a9c"]
        },
        neon: {
          name: "Neon",
          stops: [
            hexToRgb("#04060a"),
            hexToRgb("#7dff4d"),
            hexToRgb("#ff2f92"),
            hexToRgb("#29e6ff")
          ],
          hexStops: ["#04060a", "#7dff4d", "#ff2f92", "#29e6ff"]
        }
      };

      function hexToRgb(hex) {
        const h = hex.replace("#", "");
        return [
          parseInt(h.substring(0, 2), 16) / 255,
          parseInt(h.substring(2, 4), 16) / 255,
          parseInt(h.substring(4, 6), 16) / 255
        ];
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function lerpVec3(a, b, t) {
        return [
          lerp(a[0], b[0], t),
          lerp(a[1], b[1], t),
          lerp(a[2], b[2], t)
        ];
      }

      const canvas = document.getElementById("glcanvas");
      const fallbackDiv = document.getElementById("fallback");
      const fallbackNotice = document.getElementById("fallbackNotice");

      // Check WebGL availability with fallback to CSS gradient
      let gl = canvas.getContext("webgl", { alpha: false, antialias: false, depth: false }) ||
               canvas.getContext("experimental-webgl", { alpha: false, antialias: false, depth: false });

      let currentPresetKey = "plum";
      let activeColors = [
        [...PALETTES.plum.stops[0]],
        [...PALETTES.plum.stops[1]],
        [...PALETTES.plum.stops[2]],
        [...PALETTES.plum.stops[3]]
      ];
      let targetColors = [
        [...PALETTES.plum.stops[0]],
        [...PALETTES.plum.stops[1]],
        [...PALETTES.plum.stops[2]],
        [...PALETTES.plum.stops[3]]
      ];

      function applyCssFallback(presetKey) {
        const p = PALETTES[presetKey];
        fallbackDiv.style.display = "block";
        fallbackDiv.style.background = `linear-gradient(135deg, ${p.hexStops[0]} 0%, ${p.hexStops[1]} 35%, ${p.hexStops[2]} 70%, ${p.hexStops[3]} 100%)`;
      }

      if (!gl) {
        canvas.style.display = "none";
        fallbackNotice.style.display = "block";
        applyCssFallback(currentPresetKey);
        setupUI(null);
        return;
      }

      // Compile shader helper
      function createShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error("Shader compile error:", gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      }

      const vsSource = document.getElementById("vs").textContent.trim();
      const fsSource = document.getElementById("fs").textContent.trim();

      const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
      const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);

      const program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error("Program link error:", gl.getProgramInfoLog(program));
        return;
      }
      gl.useProgram(program);

      // SETUP: Oversized full-screen single triangle (-1,-1, 3,-1, -1,3)
      // Eliminates seams across two screen triangles
      const vertices = new Float32Array([
        -1.0, -1.0,
         3.0, -1.0,
        -1.0,  3.0
      ]);

      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

      const aPosLoc = gl.getAttribLocation(program, "a_pos");
      gl.enableVertexAttribArray(aPosLoc);
      gl.vertexAttribPointer(aPosLoc, 2, gl.FLOAT, false, 0, 0);

      // Uniform Locations
      const uResLoc = gl.getUniformLocation(program, "u_resolution");
      const uTimeLoc = gl.getUniformLocation(program, "u_t");
      const uPointerLoc = gl.getUniformLocation(program, "u_pointer");
      const uDitherLoc = gl.getUniformLocation(program, "u_dither_strength");
      const uC0Loc = gl.getUniformLocation(program, "u_c0");
      const uC1Loc = gl.getUniformLocation(program, "u_c1");
      const uC2Loc = gl.getUniformLocation(program, "u_c2");
      const uC3Loc = gl.getUniformLocation(program, "u_c3");

      let ditherEnabled = true;
      let ditherStrength = 0.016;

      // Handle Resize with devicePixelRatio capped at 1.5
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        const displayWidth = Math.round(window.innerWidth * dpr);
        const displayHeight = Math.round(window.innerHeight * dpr);

        if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
          canvas.width = displayWidth;
          canvas.height = displayHeight;
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.uniform2f(uResLoc, canvas.width, canvas.height);
        }
      }
      window.addEventListener("resize", resize, { passive: true });
      resize();

      // Pointer Parallax with easing
      let targetX = 0, targetY = 0;
      let currentX = 0, currentY = 0;

      window.addEventListener("pointermove", (e) => {
        // Normalized coordinates [-1, 1]
        targetX = (e.clientX / window.innerWidth) * 2.0 - 1.0;
        targetY = 1.0 - (e.clientY / window.innerHeight) * 2.0;
      }, { passive: true });

      // Render Loop
      let startTime = performance.now();
      // Period of circle: 16 seconds for a calm, luxurious loop
      const LOOP_DURATION_S = 16.0;

      function render(now) {
        const elapsed = (now - startTime) / 1000.0;
        // u_t completes full 2*PI circle seamlessly
        const ut = (elapsed * (2.0 * Math.PI) / LOOP_DURATION_S) % (2.0 * Math.PI);

        // Smooth ease towards pointer target
        currentX += (targetX - currentX) * 0.05;
        currentY += (targetY - currentY) * 0.05;

        // Smooth interpolation between palette stops
        for (let i = 0; i < 4; i++) {
          activeColors[i] = lerpVec3(activeColors[i], targetColors[i], 0.08);
        }

        gl.uniform1f(uTimeLoc, ut);
        gl.uniform2f(uPointerLoc, currentX, currentY);
        gl.uniform1f(uDitherLoc, ditherEnabled ? ditherStrength : 0.0);

        gl.uniform3fv(uC0Loc, activeColors[0]);
        gl.uniform3fv(uC1Loc, activeColors[1]);
        gl.uniform3fv(uC2Loc, activeColors[2]);
        gl.uniform3fv(uC3Loc, activeColors[3]);

        // Draw full-screen single triangle
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);

      // UI Controls setup
      function setupUI() {
        const buttons = document.querySelectorAll(".dock-btn[data-preset]");
        const ditherBtn = document.getElementById("ditherToggle");

        buttons.forEach(btn => {
          btn.addEventListener("click", () => {
            const presetKey = btn.getAttribute("data-preset");
            if (!PALETTES[presetKey]) return;

            buttons.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");

            currentPresetKey = presetKey;
            for (let i = 0; i < 4; i++) {
              targetColors[i] = [...PALETTES[presetKey].stops[i]];
            }

            if (!gl) {
              applyCssFallback(presetKey);
            }
          });
        });

        if (ditherBtn) {
          ditherBtn.addEventListener("click", () => {
            ditherEnabled = !ditherEnabled;
            ditherBtn.textContent = ditherEnabled ? "Dither: ON" : "Dither: OFF";
            ditherBtn.style.opacity = ditherEnabled ? "1.0" : "0.55";
          });
        }
      }
      setupUI();
    })();
  </script>
</body>
</html>
