services:
  - type: web
    name: hs-chatbot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/hsbot.db
      - key: CORS_ORIGINS
        value: "*"
      - key: SAMBANOVA_API_KEY
        value: ""
        sync: false
      - key: SAMBANOVA_DEFAULT_MODEL
        value: DeepSeek-V3.2
      - key: NVIDIA_API_KEYS
        value: ""
        sync: false
      - key: NVIDIA_DEFAULT_IMAGE_MODEL
        value: flux-2-klein
      - key: GOOGLE_API_KEY
        value: ""
        sync: false
