services:
  - type: web
    name: hs-chatbot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/hsbot.db
      - key: CORS_ORIGINS
        value: "*"
      - key: SAMBANOVA_API_KEY
        value: ""
        sync: false
      - key: SAMBANOVA_DEFAULT_MODEL
        value: DeepSeek-V3.2
      - key: TAVILY_API_KEY
        value: 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
      - key: TAVILY_FALLBACK_API_KEY
        value: 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
      - key: NVIDIA_API_KEYS
        value: ""
        sync: false
      - key: NVIDIA_DEFAULT_IMAGE_MODEL
        value: flux-2-klein
      - key: GOOGLE_API_KEY
        value: ""
        sync: false
      - key: CLOUDFLARE_GATEWAY_API_KEY
        value: ""
        sync: false
      - key: CLOUDFLARE_GATEWAY_ACCOUNT_ID
        value: 21e5f9f23e1d60cb56bf1200e89255f3
      - key: CLOUDFLARE_GATEWAY_SLUG
        value: default
      - key: CLOUDFLARE_GATEWAY_DEFAULT_MODEL
        value: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      - key: BROWSER_AGENT_MODE
        value: server
